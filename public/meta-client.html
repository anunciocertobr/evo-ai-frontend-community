<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Autorizar acesso ao Facebook</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      width: 100%; max-width: 24rem; background: #1e293b; border: 1px solid #334155; border-radius: 1rem;
      padding: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,.5); text-align: center;
    }
    .icon { width: 3rem; height: 3rem; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: .75rem; }
    .icon.fb { background: rgba(37, 99, 235, .2); }
    .icon.ok { background: rgba(16, 185, 129, .2); }
    .icon.err { background: rgba(248, 113, 113, .2); }
    h1 { font-size: 1.125rem; font-weight: 600; margin-bottom: .35rem; }
    p { font-size: .75rem; color: #94a3b8; line-height: 1.55; }
    button {
      width: 100%; margin-top: 1rem; border: 0; cursor: pointer; font-weight: 500; font-size: .875rem;
      padding: .8rem 1rem; border-radius: .5rem; display: inline-flex; align-items: center; justify-content: center;
      gap: .5rem; transition: background .15s;
    }
    button.primary { background: #2563eb; color: #fff; }
    button.primary:hover { background: #3b82f6; }
    button.ghost { background: transparent; color: #cbd5e1; border: 1px solid #475569; margin-top: .5rem; }
    button.ghost:hover { border-color: #64748b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="pnl-ready" class="hidden">
      <div class="icon fb"><svg width="22" height="22" viewBox="0 0 24 24" fill="#3b82f6"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg></div>
      <h1>Autorizar o acesso do cliente</h1>
      <p>O dono da Business Manager confirma quem é e o acesso fica registrado. O token é guardado em segurança.</p>
      <button id="btn-login" class="primary">Autorizar com Facebook</button>
    </div>

    <div id="pnl-success" class="hidden">
      <div class="icon ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1>Tudo certo!</h1>
      <p id="msg-success">Acesso concedido com sucesso! Pode fechar esta janela.</p>
    </div>

    <div id="pnl-error" class="hidden">
      <div class="icon err"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <h1>Algo deu errado</h1>
      <p id="msg-error"></p>
      <button id="btn-retry" class="ghost">Tentar novamente</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Endpoint público que recebe o token quando o link foi gerado com grant
      // (cliente abriu o link copiável SEM sessão no CRM).
      var API_BASE = 'https://api-crmcerto.anunciocertobr.com.br';
      var VERSION = 'v21.0';

      var params = new URLSearchParams(window.location.search);
      var appId = params.get('app_id');
      var scope = params.get('scope');
      var grant = params.get('grant');
      var isGrantMode = !!grant;

      var pnl = {
        ready: document.getElementById('pnl-ready'),
        success: document.getElementById('pnl-success'),
        error: document.getElementById('pnl-error')
      };
      var msgError = document.getElementById('msg-error');
      var msgSuccess = document.getElementById('msg-success');
      var btnLogin = document.getElementById('btn-login');
      var btnRetry = document.getElementById('btn-retry');

      function show(name, payload) {
        Object.keys(pnl).forEach(function (k) { pnl[k].classList.add('hidden'); });
        pnl[name].classList.remove('hidden');
        if (name === 'error') msgError.textContent = payload || 'Tente novamente.';
        if (name === 'success' && payload) msgSuccess.textContent = payload;
      }

      function notifyOpener(payload) {
        try { if (window.opener) window.opener.postMessage({ type: 'evo-meta-client-access', status: payload.status, fb_user_id: payload.fb_user_id, token: payload.token, error: payload.error }, '*'); }
        catch (e) { /* opener ausente — o dashboard cobre com polling */ }
      }

      function dialogUrl() {
        var redirect = window.location.origin + window.location.pathname;
        var href = 'https://www.facebook.com/' + VERSION + '/dialog/oauth' +
          '?client_id=' + encodeURIComponent(appId) +
          '&redirect_uri=' + encodeURIComponent(redirect) +
          '&scope=' + encodeURIComponent(scope) +
          '&state=' + (grant || 'popup') +
          '&response_type=token';
        return href;
      }

      function delayedClose(ms) {
        setTimeout(function () { try { window.close(); } catch (e) { /* noop */ } }, ms || 2500);
      }

      function grantModeReport(fbUserId, token) {
        fetch(API_BASE + '/public/api/v1/meta_client/grants', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ grant: grant, fb_user_id: fbUserId, token: token })
        }).then(function (res) { return res.json().catch(function () { return null; }); }).then(function (data) {
          if (data && data.success) {
            show('success', 'Acesso concedido com sucesso! Pode fechar esta janela.');
            delayedClose(2500);
          } else {
            show('error', (data && data.error) || 'Falha ao registrar o acesso. Tente novamente.');
          }
        }).catch(function () {
          show('error', 'Falha ao comunicar com o servidor. Verifique sua conexão e tente de novo.');
        });
      }

      function afterLogin(fbUserId, token) {
        if (isGrantMode) {
          grantModeReport(fbUserId, token);
          return;
        }
        show('success', 'Login OK! Esta janela vai fechar sozinha — confira no dashboard.');
        notifyOpener({ status: 'ok', fb_user_id: fbUserId, token: token });
        delayedClose(2500);
      }

      // Retorno do diálogo: #access_token=...&expires_in=...&user_id=...&state=...
      var hash = window.location.hash;
      var frag = {};
      if (hash) {
        hash.replace(/^#/, '').split('&').forEach(function (kv) {
          var p = kv.split('=');
          if (p[0]) frag[p[0]] = decodeURIComponent(p[1] || '');
        });
      }
      if (frag.access_token) {
        afterLogin(String(frag.user_id || ''), frag.access_token);
      } else if (hash) {
        show('error', 'O Facebook não devolveu o token. Feche e abra o link de novo.');
      } else if (params.get('error')) {
        var el = params.get('error_description') || params.get('error');
        show('error', (isGrantMode ? 'Autorização não concluída (' : 'Login cancelado (') + el + ').');
      } else {
        if (!appId || !scope) {
          show('error', 'Link inválido — parâmetros de login ausentes. Peça um novo link no painel do CRM.');
        } else {
          show('ready');
        }
      }

      btnLogin.addEventListener('click', function () {
        window.location.href = dialogUrl();
      });
      btnRetry.addEventListener('click', function () {
        window.location.href = dialogUrl();
      });
    })();
  </script>
</body>
</html>
