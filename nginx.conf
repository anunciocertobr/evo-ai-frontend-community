server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    # NOTE: Do not set X-Frame-Options globally because /widget must be embeddable in third-party sites.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: 'wasm-unsafe-eval' is required by FFmpeg WASM (self-hosted under /ffmpeg/).
    # 'worker-src blob:' allows the FFmpeg core worker; 'connect-src' is permissive for
    # backend/CDN-less deploys — tighten per environment if needed.
    # script-src allows the Facebook SDK (WhatsApp Cloud / Facebook / Instagram Embedded
    # Signup) and Google Tag Manager (GA4) — both load external scripts that would
    # otherwise be blocked. 'blob:' is required by FFmpeg WASM which loads its worker
    # as a Blob URL; connect-src 'blob:' is required so the audio recorder can fetch
    # the recorded blob before transcoding to OGG/Opus.
    # frame-src is permissive because user-registered sites (submenu Sites) are
    # displayed in an iframe inside /sites/:slug.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https: http: data: blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Relatório público dos links de Dashboard › Relatórios.
    #
    # A URL /r/:token precisa continuar no domínio do CRM porque é o domínio
    # do app Android (TWA). A página em si é servida pela API: é o mesmo HTML
    # do relatório do Dashboard, com o Personal Access Token trocado pelo token
    # do link. Servir por aqui em vez de pela SPA é deliberado — a versão React
    # era uma tabela simplificada, sem nenhum dos gráficos do relatório.
    #
    # `^~` faz o prefixo casar antes dos regexes de asset lá embaixo, e o
    # `proxy_pass` com URI troca o prefixo /r/ por /public/r/.
    location ^~ /r/ {
        proxy_pass https://api-crmcerto.anunciocertobr.com.br/public/r/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api-crmcerto.anunciocertobr.com.br;
        proxy_ssl_server_name on;
        proxy_ssl_name api-crmcerto.anunciocertobr.com.br;
        # O relatório puxa dados da Graph API e pode demorar alguns segundos
        # na primeira carga; 30s evita a página em branco do cliente sem
        # segurar conexão por muito tempo.
        proxy_read_timeout 30s;
        # Declarar QUALQUER add_header aqui cancela a herança dos headers do
        # bloco server — inclusive do Content-Security-Policy, que bloqueia os
        # CDNs do relatório (Tailwind, Chart.js, Leaflet) e deixaria a página
        # sem estilo e sem gráficos. Este header existe por isso, não por
        # colateral, não por política de segurança em si.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Widget route must be embeddable in customer websites (iframe).
    location = /widget {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA routing - serve index.html for all routes.
    # index.html itself must never be cached by the browser: it references the
    # hashed asset filenames (index-XXXX.js/css) from the current build, and
    # those filenames change (old ones get deleted) on every rebuild — a
    # cached index.html pointing at deleted assets is exactly what produces
    # the "tela branca" after a redeploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Digital Asset Links: verificação de dono do domínio pro app Android (TWA)
    # da Play Store abrir sem barra de endereço do navegador. nginx:alpine não
    # mapeia .json -> application/json no mime.types padrão; o verificador do
    # Android aceita texto puro na prática, mas o content-type correto evita
    # qualquer ambiguidade.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
